<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Финансы</title>
    <link rel="stylesheet" href="globals.css" />
    <link rel="stylesheet" href="styleguide.css" />
    <link rel="stylesheet" href="style.css" />
    <script src="./script.js" defer></script>
  </head>
  <body data-shadcn-theme-mode="light" data-colors-mode="light">
    <img src="./icons/t-bank-logo-en 1.svg" style="position: absolute; right: 400px; top: 50px;"></img>
    <main class="app-shell">
      <header class="app-header">
        <div><h1>67Flow</h1></div>
      </header>

      <section class="stats-grid" aria-label="Сводка">
        <article class="stat-card stat-card--balance">
          <p>Текущий баланс</p>
          <strong><span id="balance">0</span></strong>
        </article>
        <article class="stat-card stat-card--income">
          <p>Доходы</p>
          <strong><span id="income">0</span></strong>
        </article>
        <article class="stat-card stat-card--expenses">
          <p>Расходы</p>
          <strong><span id="expenses">0</span></strong>
        </article>
      </section>

      <section class="content-grid">
        <section class="panel transaction-form-panel" aria-labelledby="add-title">
          <div class="panel-heading">
            <div>
              <p class="eyebrow">Новая запись</p>
              <h2 id="add-title">Добавить транзакцию</h2>
            </div>
          </div>

          <form class="transaction-form" id="addTransactionForm">
            <div class="field-row">
              <label class="field">
                <span>Тип</span>
                <select name="type" required>
                  <option value="expenses">Расход</option>
                  <option value="income">Доход</option>
                </select>
              </label>

              <label class="field">
                <span>Сумма</span>
                <input name="sum" type="number" min="1" step="1" placeholder="0" required />
              </label>
            </div>

            <label class="field">
              <span>Категория</span>
              <input name="category" type="text" placeholder="Например, продукты" required />
            </label>

            <label class="field">
              <span>Дата</span>
              <input name="date" type="date" required />
            </label>

            <label class="field">
              <span>Комментарий</span>
              <textarea name="comment" rows="4" placeholder="Необязательно"></textarea>
            </label>

            <button class="primary-button" type="submit">Добавить</button>
          </form>
        </section>

        <section class="panel history-panel" aria-labelledby="history-title">
          <div class="panel-heading panel-heading--wide">
            <div>
              <p class="eyebrow">Журнал</p>
              <h2 id="history-title">История транзакций</h2>
            </div>

            <div class="history-actions">
              <button class="secondary-button" onclick="exportCsv()" type="button">CSV</button>
            </div>
          </div>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th><a onclick="changeSortby('date');">Дата</a></th>
                  <th><a onclick="changeSortby('category');">Категория</a></th>
                  <th><a onclick="changeSortby('sum');">Сумма</a></th>
                  <th>Комментарий</th>
                  <th>Действия</th>
                </tr>
              </thead>
              <tbody id="transactions"></tbody>
            </table>
          </div>
        </section>
      </section>
    </main>
  </body>
</html>
